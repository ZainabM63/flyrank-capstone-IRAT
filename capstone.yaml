name: "AI Image Understanding & Content Matching Engine"
version: "1.0.0"
run: "uvicorn src.main:app --host 0.0.0.0 --port 8000"
test: "pytest"
base_url: "http://localhost:8000"
endpoints:
  - path: "/posts/{id}/images"
    method: "GET"
    description: "Returns ranked, mismatch-guarded image suggestions for a blog post."
  - path: "/reviews"
    method: "POST"
    description: "Approve or reject a suggested image pairing with audit reasons."